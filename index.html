<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEC Summit 2026 — Rideshare Lookup</title>
<style>
  :root {
    /* Jazz Pharmaceuticals brand palette */
    --jazz-prussian:  #001C71;   /* primary dark — header, nav */
    --jazz-purple:    #852166;   /* primary brand accent */
    --jazz-yellow:    #FFCF01;   /* highlight bar */
    --jazz-french:    #5673B8;   /* French Blue — arrival accent */
    --jazz-heading:   #5075D3;   /* interactive / link blue */
    --jazz-slate:     #636466;   /* body text */
    --jazz-warm:      #F7F6F4;   /* page background */
    --jazz-pale:      #F3F6FB;   /* card / panel background */
    --jazz-line:      #D7DCE5;   /* borders */
    --jazz-aqua:      #39BB9D;   /* positive / all-clear accent */

    /* Semantic aliases */
    --arrival:        #5673B8;   /* French Blue */
    --arrival-bg:     #EEF2FB;   /* pale blue */
    --departure:      #852166;   /* Jazz Purple */
    --departure-bg:   #F5ECF2;   /* pale purple */
    --warn-bg:        #FFF7D6;   /* pale yellow */
    --warn-border:    #FFCF01;
    --ok-bg:          #E5F7F3;
    --ok-border:      #39BB9D;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, "Arial Narrow", sans-serif; background: var(--jazz-warm); color: var(--jazz-prussian); min-height: 100vh; }

  /* Yellow accent bar + Prussian Blue header — matches Jazz deck style */
  header { background: var(--jazz-prussian); color: #fff; padding: 0 32px; border-bottom: none; }
  .header-bar { height: 6px; background: linear-gradient(90deg, var(--jazz-purple) 33%, var(--jazz-yellow) 33% 66%, var(--jazz-french) 66%); }
  .header-inner { padding: 18px 0 14px; }
  header h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: 0.02em; }
  header p  { font-size: 0.85rem; color: #b0bcd8; margin-top: 4px; }

  .tabs { display: flex; background: #fff; border-bottom: 2px solid var(--jazz-line); padding: 0 32px; }
  .tab-btn { padding: 12px 20px; border: none; background: none; font-size: 0.9rem; font-family: Arial, sans-serif; font-weight: 600; color: var(--jazz-slate); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; transition: color 0.15s, border-color 0.15s; }
  .tab-btn:hover { color: var(--jazz-purple); }
  .tab-btn.active { color: var(--jazz-purple); border-bottom-color: var(--jazz-purple); }
  .tab-badge { display: inline-block; background: var(--jazz-purple); color: #fff; font-size: 0.7rem; font-weight: 700; border-radius: 10px; padding: 1px 6px; margin-left: 6px; vertical-align: middle; }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .search-section { background: #fff; padding: 20px 32px; border-bottom: 1px solid var(--jazz-line); display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .search-section label { font-weight: 700; font-size: 0.95rem; white-space: nowrap; color: var(--jazz-prussian); }
  #nameSearch { flex: 1; min-width: 220px; max-width: 400px; padding: 10px 14px; border: 2px solid var(--jazz-line); border-radius: 4px; font-size: 1rem; font-family: Arial, sans-serif; outline: none; transition: border-color 0.2s; }
  #nameSearch:focus { border-color: var(--jazz-heading); box-shadow: 0 0 0 3px rgba(80,117,211,0.15); }
  .hint { font-size: 0.8rem; color: var(--jazz-slate); }
  #clearBtn { padding: 10px 18px; background: var(--jazz-purple); color: #fff; border: none; border-radius: 4px; font-size: 0.9rem; cursor: pointer; white-space: nowrap; font-family: Arial, sans-serif; font-weight: 600; }
  #clearBtn:hover { background: #6b1a52; }

  main { padding: 24px 32px; }
  #resultsLabel { font-size: 0.85rem; color: var(--jazz-slate); margin-bottom: 16px; }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
  .card { background: #fff; border: 1px solid var(--jazz-line); border-radius: 4px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,28,113,0.08); }
  .card-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; gap: 12px; }
  .card-header.arrival   { background: var(--arrival-bg);   border-bottom: 3px solid var(--arrival); }
  .card-header.departure { background: var(--departure-bg); border-bottom: 3px solid var(--departure); }
  .direction-badge { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 3px 8px; border-radius: 3px; }
  .arrival   .direction-badge { background: var(--arrival);   color: #fff; }
  .departure .direction-badge { background: var(--departure); color: #fff; }
  .group-id     { font-size: 0.75rem; font-weight: 700; color: var(--jazz-slate); letter-spacing: 0.05em; }
  .airport-badge { font-size: 1.1rem; font-weight: 700; color: var(--jazz-prussian); }
  .card-body { padding: 14px 16px; }
  .card-row { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; font-size: 0.88rem; }
  .card-row:last-child { margin-bottom: 0; }
  .card-icon  { font-size: 1rem; flex-shrink: 0; width: 20px; text-align: center; margin-top: 1px; }
  .card-label { font-weight: 700; color: var(--jazz-slate); min-width: 72px; flex-shrink: 0; }
  .card-value { color: var(--jazz-prussian); line-height: 1.4; }
  .terminal-value { font-size: 1.05rem; font-weight: 700; color: var(--jazz-heading); }
  .travelers-list { line-height: 1.7; }
  .traveler-name { display: inline-block; padding: 1px 6px; border-radius: 3px; margin: 1px 2px 1px 0; font-size: 0.82rem; }
  .traveler-name.highlight { background: var(--jazz-yellow); font-weight: 700; color: var(--jazz-prussian); outline: 2px solid #d4a800; }

  /* Gaps tab */
  .gaps-intro { border-radius: 4px; padding: 14px 18px; margin-bottom: 24px; font-size: 0.88rem; line-height: 1.6; }
  .gaps-intro.all-clear { background: var(--ok-bg);   border: 1px solid var(--ok-border); color: #0d4a38; }
  .gaps-intro.has-gaps  { background: var(--warn-bg); border: 1px solid #d4a800;           color: #5a4200; }
  .gaps-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
  .gap-section h3 { font-size: 0.8rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #fff; padding: 8px 14px; border-radius: 4px 4px 0 0; }
  .gap-section.arrival-only   h3 { background: var(--arrival); }
  .gap-section.departure-only h3 { background: var(--departure); }
  .gap-list { background: #fff; border: 1px solid var(--jazz-line); border-top: none; border-radius: 0 0 4px 4px; overflow: hidden; }
  .gap-row { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-bottom: 1px solid var(--jazz-line); font-size: 0.88rem; }
  .gap-row:last-child { border-bottom: none; }
  .gap-row .name { flex: 1; font-weight: 600; color: var(--jazz-prussian); }
  .gap-missing { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 7px; border-radius: 3px; background: #F5ECF2; color: var(--jazz-purple); border: 1px solid var(--jazz-purple); }
  .tbc-note { font-size: 0.75rem; color: #9c3300; font-weight: 600; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--jazz-slate); grid-column: 1 / -1; }
  .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }

  @media (max-width: 600px) {
    .header-inner, .search-section, main { padding: 16px; }
    .cards, .gaps-grid { grid-template-columns: 1fr; }
    .tabs { padding: 0 16px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-bar"></div>
  <div class="header-inner">
    <h1>DEC Summit 2026 — Rideshare Lookup</h1>
    <p>San Diego · Nov 13–23, 2026 · Find your group, terminal, and travel companions</p>
  </div>
</header>

<div class="tabs">
  <button class="tab-btn active" onclick="showTab('lookup', this)">🔍 Name Lookup</button>
  <button class="tab-btn" onclick="showTab('gaps', this)">⚠️ Coverage Gaps <span class="tab-badge" id="gapsBadge">…</span></button>
</div>

<!-- ════ TAB 1: LOOKUP ════ -->
<div id="panel-lookup" class="tab-panel active">

    <button id="clearBtn" onclick="clearSearch()">Show All</button>
    <span class="hint">Type any part of your name</span>
  </div>
  <main>
    <div id="resultsLabel"></div>
    <div class="cards" id="cardsContainer"></div>
  </main>
</div>

<!-- ════ TAB 2: GAPS ════ -->
<div id="panel-gaps" class="tab-panel">
  <main>
    <div id="gapsIntro" class="gaps-intro"></div>
    <div class="gaps-grid" id="gapsContainer"></div>
  </main>
</div>

// ── Gap analysis ──────────────────────────────────────────────────────────
const nameDir = {};
DATA.forEach(row => {
  row.travelers.split(',').map(n => n.trim()).filter(Boolean).forEach(name => {
    if (!nameDir[name]) nameDir[name] = new Set();
    nameDir[name].add(row.direction);
  });
});
const arrivalOnly   = Object.keys(nameDir).filter(n => nameDir[n].has('Arrival')   && !nameDir[n].has('Departure')).sort();
const departureOnly = Object.keys(nameDir).filter(n => nameDir[n].has('Departure') && !nameDir[n].has('Arrival')).sort();
const gapCount = arrivalOnly.length + departureOnly.length;
const tbcNames = DATA.filter(r => r.datetime.includes('TBC')).flatMap(r => r.travelers.split(',').map(n => n.trim()));

document.getElementById('gapsBadge').textContent = gapCount || '✓';
if (!gapCount) document.getElementById('gapsBadge').style.background = '#1A7A4A';

// ── Tabs ──────────────────────────────────────────────────────────────────
function showTab(name, btn) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
  btn.classList.add('active');
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Lookup tab ────────────────────────────────────────────────────────────
const container   = document.getElementById('cardsContainer');
const resultsLbl  = document.getElementById('resultsLabel');
const searchInput = document.getElementById('nameSearch');

function renderCards(query) {
  const q = query.trim().toLowerCase();
  const filtered = q ? DATA.filter(r => r.travelers.toLowerCase().includes(q)) : DATA;

  resultsLbl.textContent = q
    ? `${filtered.length} group${filtered.length !== 1 ? 's' : ''} found for "${query.trim()}"`
    : `Showing all ${DATA.length} ride groups`;

  if (!filtered.length) {
    container.innerHTML = `<div class="empty-state"><div class="icon">🔍</div><p>No groups found for "<strong>${escapeHtml(query.trim())}</strong>".<br>Try a first name, last name, or partial name.</p></div>`;
    return;
  }

  container.innerHTML = filtered.map(row => {
    const dirClass = row.direction.toLowerCase();
    const dirIcon  = row.direction === 'Arrival' ? '🛬' : '🛫';
    const isTbc    = row.datetime.includes('TBC');
    const travelerHtml = row.travelers.split(',').map(n => {
      n = n.trim();
      const isMatch = q && n.toLowerCase().includes(q);
      return `<span class="traveler-name${isMatch ? ' highlight' : ''}">${escapeHtml(n)}</span>`;
    }).join('');
    const termDisplay = row.terminal || '<em style="color:#aaa">—</em>';
    const dtDisplay   = isTbc
      ? `<span style="color:#9c3300;font-weight:700;">${escapeHtml(row.datetime)}</span>`
      : escapeHtml(row.datetime);
    return `
    <div class="card">
      <div class="card-header ${dirClass}">
        <span class="airport-badge">${escapeHtml(row.airport)}</span>
        <span class="direction-badge">${dirIcon} ${escapeHtml(row.direction)}</span>
        <span class="group-id">${escapeHtml(row.id)}</span>
      </div>
      <div class="card-body">
        <div class="card-row"><span class="card-icon">🕐</span><span class="card-label">When</span><span class="card-value">${dtDisplay}</span></div>
        <div class="card-row"><span class="card-icon">🏢</span><span class="card-label">Terminal</span><span class="card-value terminal-value">${termDisplay}</span></div>
        <div class="card-row"><span class="card-icon">👥</span><span class="card-label">Travelers</span><span class="card-value travelers-list">${travelerHtml}</span></div>
      </div>
    </div>`;
  }).join('');
}

function clearSearch() { searchInput.value = ''; renderCards(''); searchInput.focus(); }
searchInput.addEventListener('input', () => renderCards(searchInput.value));
renderCards('');

// ── Gaps tab ──────────────────────────────────────────────────────────────
(function renderGaps() {
  const intro = document.getElementById('gapsIntro');
  const gc    = document.getElementById('gapsContainer');

  if (!gapCount && !tbcNames.length) {
    intro.className = 'gaps-intro all-clear';
    intro.innerHTML = '<strong>✅ All clear.</strong> Every traveler has both an arrival and a departure recorded in the rideshare consolidation.';
    return;
  }

  let introHtml = '';
  if (gapCount) {
    intro.className = 'gaps-intro has-gaps';
    introHtml += `<strong>${gapCount} travelers</strong> appear in only one direction — they may be making their own arrangements or their entry is still missing.`;
  } else {
    intro.className = 'gaps-intro all-clear';
    introHtml += '<strong>✅ All travelers</strong> have both an arrival and a departure recorded.';
  }
  if (tbcNames.length) {
    introHtml += `<br><strong>⚠️ ${tbcNames.length} traveler${tbcNames.length>1?'s':''}</strong> have a flight recorded but departure time is TBC: ${tbcNames.map(n => `<em>${escapeHtml(n)}</em>`).join(', ')}.`;
  }
  intro.innerHTML = introHtml;

  function buildSection(names, cssClass, title, missingLabel) {
    if (!names.length) return '';
    const rows = names.map(n => `<div class="gap-row"><span class="name">${escapeHtml(n)}</span><span class="gap-missing">${missingLabel} missing</span></div>`).join('');
    return `<div class="gap-section ${cssClass}"><h3>${title} (${names.length})</h3><div class="gap-list">${rows}</div></div>`;
  }

  gc.innerHTML =
    buildSection(arrivalOnly,   'arrival-only',   '🛬 Arrival only — no departure', 'Departure') +
    buildSection(departureOnly, 'departure-only', '🛫 Departure only — no arrival', 'Arrival');
})();
</script>
</body>
</html>
